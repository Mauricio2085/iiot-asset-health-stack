networks:
  gateway-net:
    driver: bridge

volumes:
  mosquitto_data:
  mosquitto_log:
services:
  # ===========================================================
  # BROKER MQTT LOCAL (Mosquitto)
  # ===========================================================
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: edge-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883" # Standard MQTT port
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - gateway-net
    deploy:
      resources:
        limits:
          memory: 128M

  # ===========================================================
  # INSTANCE 1: OT INGESTION / DRIVERS (OPC UA, Modbus, S7, etc.)
  # ===========================================================
  node-red-ingestion:
    image: nodered/node-red:4.0
    container_name: edge-node-red-ingestion
    restart: unless-stopped
    ports:
      - "1881:1880"
    environment:
      - TZ=America/Bogota
      - NODE_RED_CREDENTIAL_SECRET=${NODE_RED_CREDENTIAL_SECRET}
      - OPCUA_ENDPOINT=${OPCUA_ENDPOINT}
    volumes:
      - ./nodered/ingestion/data:/data
    depends_on:
      - mosquitto
    networks:
      - gateway-net
    deploy:
      resources:
        limits:
          memory: 512M
