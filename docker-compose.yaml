networks:
  gateway-net:
    driver: bridge

volumes:
  mosquitto_data:
  mosquitto_log:
  timescaledb_data:
services:
  # ===========================================================
  # BROKER MQTT LOCAL (Mosquitto)
  # ===========================================================
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: edge-mosquitto
    restart: unless-stopped
    ports:
      - "1883:1883" # Standard MQTT port
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - gateway-net
    deploy:
      resources:
        limits:
          memory: 128M

  # ===========================================================
  # INSTANCE 1: OT INGESTION / DRIVERS (OPC UA, Modbus, S7, etc.)
  # ===========================================================
  node-red-ingestion:
    image: nodered/node-red:4.0
    container_name: edge-node-red-ingestion
    restart: unless-stopped
    ports:
      - "1881:1880"
    environment:
      - TZ=America/Bogota
      - NODE_RED_CREDENTIAL_SECRET=${NODE_RED_CREDENTIAL_SECRET}
      - OPCUA_ENDPOINT=${OPCUA_ENDPOINT}
    volumes:
      - ./nodered/ingestion/data:/data
    depends_on:
      - mosquitto
    networks:
      - gateway-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ===========================================================
  # INSTANCE 2: ETL / NORMALIZATION (MQTT -> TimescaleDB)
  # ===========================================================
  node-red-etl:
    image: nodered/node-red:4.0
    container_name: edge-node-red-etl
    restart: unless-stopped
    ports:
      - "1882:1880"
    environment:
      - TZ=America/Bogota
      - NODE_RED_CREDENTIAL_SECRET=${NODE_RED_CREDENTIAL_SECRET}
    volumes:
      - ./nodered/etl/data:/data
    depends_on:
      - mosquitto
    networks:
      - gateway-net
    deploy:
      resources:
        limits:
          memory: 512M

  # ===========================================================
  # TIME-SERIES STORAGE (PostgreSQL + TimescaleDB)
  # ===========================================================
  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: edge-timescaledb
    restart: unless-stopped
    ports:
      - "5435:5432"
    environment:
      - TZ=America/Bogota
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - gateway-net
    deploy:
      resources:
        limits:
          memory: 1G
